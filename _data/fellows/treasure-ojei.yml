# ── PROFILE ──────────────────────────────────────
bio: "Treasure Ojei is an Associate Fellow of the CFK Fellowship, where she currently serves as Program Administrator for the WikiQuestions program. She joined the Fellowship as part of the 2025 Spring Cohort, contributing to the digitisation of past examination questions through the WikiQuestions program. Since then, she has taken on greater responsibilities that have stretched and challenged her, seeing each opportunity as her own little way of contributing to the development of the next generation of leaders."
statement: "I joined the CFK because I actually do care for knowledge and I believe that when you help in building something that would echo through time, you also unknowingly build yourself in the process. It’s a win-win."

