# ── PROFILE ──────────────────────────────────────
bio: "Tabitha Adegboye is an Associate Fellow contributing through the CFK Fellowship, where she has served as a Mentor, Fellowship Experience Lead, and currently as a Cohort Manager. She has also contributed to the CTRI arm of the Fellowship through Biology, taking on growing responsibility for supporting Fellows, strengthening cohort experiences, and advancing CFK’s educational mission."
statement: "I joined CFK because I wanted to be part of something that contributes meaningfully to the growth of others, particularly through education, service, and community. What I did not expect was how much the Fellowship would also challenge me to grow personally. Through serving as a Mentor, Fellowship Experience Lead, Cohort Manager, and contributing to CTRI in Biology, I have learned that contribution is not just about what you do, but about how consistently and intentionally you show up. CFK has helped me understand responsibility in a deeper way, and I am still learning to balance my commitments while giving my best to the people and purpose I serve. The Fellowship has become a space where I continue to learn, serve, reflect, and grow."

