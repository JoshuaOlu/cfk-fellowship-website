# ── PROFILE ──────────────────────────────────────
bio: "Peace Oyegbola is an Associate Fellow contributing to the CFK Fellowship through her work in compliance, internal controls, and administrative support. She joined CFK in 2024 as part of the founding WikiQuestions digitisation volunteer team and has since taken on broader responsibilities within the organisation. She is passionate about developing systems that make organisations more effective, accountable, and impactful. Her work is guided by a desire to use knowledge, structure, and collaboration to help people and communities grow sustainably."
statement: "I believe that the educational system can be better than it is, and I want to contribute to that change, no matter how little my contribution may seem. CFK has given me a platform to not only make a difference but also be part of a community of changemakers who are committed to creating meaningful impact. Through the Fellowship, I am learning that change does not always have to start big; it can begin with small, consistent efforts and people who are willing to take responsibility for making things better."

