# ── PROFILE ──────────────────────────────────────
bio: "Janet Fasoro is an Associate Fellow of the CFK Fellowship and contributes as a member of the RMC team. She also leads CFK’s finance and fundraising efforts while providing administrative support to CTRI. Through these diverse roles, Janet continues to take on greater responsibilities and make meaningful contributions to the growth and impact of the Fellowship."
statement: "I have always been a fan of volunteering because it gives me the opportunity to give back to society in whatever way I can. What started as a volunteering opportunity with CFK gradually grew into something much more meaningful. It became a space where I could not only volunteer and contribute but also learn, develop new skills, take on responsibilities, and grow. Through this fellowship, I have learned to embrace growth, seek out opportunities to improve myself, and take on challenges that push me beyond my comfort zone. I am still here, learning, growing, contributing, and becoming."

