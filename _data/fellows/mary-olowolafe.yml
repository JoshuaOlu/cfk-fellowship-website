bio: "Olowolafe Mofiyinfoluwa Mary is an Associate Fellow contributing to CTRI (Collaborative Tutorial Resource Initiative), where she serves as the lead writer for the Physics team. She is currently helping develop a physics textbook, contributing to the project as it takes shape from its early stages. She is driven by a passion for making learning more accessible, engaging, and genuinely useful to students."
statement: "I joined the Fellowship because I wanted to contribute to something meaningful while learning from others. Through CTRI, I’m helping develop a Physics textbook, which has given me the opportunity to think about how complex ideas can be made simpler and more accessible to students. I’m excited to keep learning, contributing, and seeing where the project goes."

