# ── PROFILE ──────────────────────────────────────
bio: "Olugbile Feyifunmi is an Associate Fellow contributing to the CFK Fellowship, where she works with the Model NASS Lore and Continuity Team. She joined CFK in 2025 as a volunteer in the Model NASS Lore and Continuity team and eventually became a Fellow in the Spring 2026 cohort of the Fellowship. She continues to learn, evolve, and contribute meaningfully in her own unique way to Model NASS and the Fellowship more broadly"
statement: "I joined CFK because I wanted to develop myself and grow in areas beyond academics. Over time, it has become a space where I’ve learned to take on responsibility, explore my creativity, and build skills outside the classroom. Through my role in the Lore and Continuity Team in Model NASS, I’ve had the opportunity to explore the fictional world and contribute to shaping and developing the lore. It has been an interesting experience that continues to challenge me to learn and see things from different perspectives. The LIGHT sessions have also been a meaningful part of my experience. They are always insightful and have helped shape my mindset, broaden my perspective, and develop my skills. I’m still learning, evolving, and figuring out many things about myself, and CFK has been a valuable part of that journey."

