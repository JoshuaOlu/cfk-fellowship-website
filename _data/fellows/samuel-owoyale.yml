bio: "Samuel Owoyale is a Fellow contributing to the CFK Fellowship through creative design, communication, and collaborative projects. He uses his skills in graphic design to support initiatives that connect ideas with people in meaningful ways. He is driven by a desire to learn, create impact, and use his creativity to contribute to positive change within his community."
statement: "I joined the Fellowship because I wanted to grow, contribute, and be part of a community where my ideas and skills could be useful beyond myself. Since joining, I have learned that meaningful impact is not always about doing something big; sometimes it is about showing up, working with others, and being willing to learn along the way. The Fellowship has helped me become more intentional about how I use my skills, especially in design, and service. I am still learning, asking questions, and discovering what I can build when I combine my creativity with a genuine desire to solve problems and help others."

