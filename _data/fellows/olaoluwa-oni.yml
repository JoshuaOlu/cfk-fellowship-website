bio: "Olaoluwa Oni is a Fellow contributing to the Care For Knowledge Fellowship through the Recruitment and Marketing team. He supports the Fellowship’s communication and outreach efforts, particularly through graphic design and visual content. He also contributes to CFK projects and initiatives where his creative and communication skills can be useful. Olaoluwa is driven by the opportunity to learn, contribute meaningfully, and help turn ideas into work that creates value for others."
statement: "I joined CFK because I wanted to be part of a community where I could contribute my skills while also learning from other people. So far, the Fellowship has given me the opportunity to contribute through the Recruitment and Marketing team, especially with design and other creative work. I have also been involved in supporting some of the Fellowship’s projects, which has helped me understand that contribution is not always about having the biggest role, but about being willing to do your part. I am still learning, improving my skills, and finding better ways to contribute. CFK has given me a space to do that while working with people who care about making an impact."

