<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% if page.title %}{{ page.title }} — CFK Fellowship{% else %}CFK Fellowship | Care for Knowledge{% endif %}</title>
  <meta name="description" content="{% if page.description %}{{ page.description }}{% else %}{{ site.description }}{% endif %}">
  <meta name="author" content="Care for Knowledge">
  <meta name="robots" content="index, follow">
  <link rel="canonical" href="{{ site.url }}{{ page.url }}">

  <!-- Favicons -->
  <link rel="icon" type="image/x-icon" href="/assets/images/favicon/favicon.ico">
  <link rel="icon" type="image/png" sizes="192x192" href="/assets/images/favicon/favicon-192.png">
  <link rel="icon" type="image/png" sizes="512x512" href="/assets/images/favicon/favicon-512.png">
  <link rel="apple-touch-icon" href="/assets/images/favicon/favicon-192.png">

  <!-- Open Graph / Social sharing -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="{{ site.url }}{{ page.url }}">
  <meta property="og:title" content="{% if page.og_title %}{{ page.og_title }}{% elsif page.title %}{{ page.title }} — CFK Fellowship{% else %}CFK Fellowship{% endif %}">
  <meta property="og:description" content="{% if page.og_description %}{{ page.og_description }}{% elsif page.description %}{{ page.description }}{% else %}{{ site.description }}{% endif %}">
  <meta property="og:image" content="{{ site.url }}{% if page.og_image %}{{ page.og_image }}{% else %}/assets/images/og-image.jpg{% endif %}">
  <meta property="og:site_name" content="CFK Fellowship">
  <meta name="twitter:card" content="summary_large_image">

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Urbanist:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

  <!-- Main stylesheet -->
  <link rel="stylesheet" href="/assets/css/style.css">

  {% if page.extra_css %}{{ page.extra_css }}{% endif %}
</head>
<body>

  {% include nav.html %}

  {{ content }}

  {% include footer.html %}

  <!-- Scroll animation — runs on every page -->
  <script>
    const scrollObserver = new IntersectionObserver((entries, observer) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          entry.target.classList.add('visible');
          observer.unobserve(entry.target);
        }
      });
    }, { threshold: 0.08, rootMargin: '0px 0px -40px 0px' });

    document.querySelectorAll('.anim').forEach(el => scrollObserver.observe(el));
  </script>

  {% if page.extra_js %}{{ page.extra_js }}{% endif %}

</body>
</html>
